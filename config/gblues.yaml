name: Unknown Overlay 0xc
sha1: 466f2d11b6bb49df667465c1df6eca74579b90b1
# most of this is copy/pasted from other yaml configurations
options:
  basename: gblues.bin
  target_path: disc/gblues.bin
  base_path: ../
  platform: psx
  compiler: PSYQ

  asm_path: asm/gblues
  src_path: src/gblues
  build_path: build/

  ld_script_path: linker/gblues.ld

  find_file_boundaries: False
  # I set this to the root address of the overlay
  gp_value: 0x801DC000
  global_vram_start: 0x80010000

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbol_addrs.gblues.txt
    - config/symbol_addrs.slus_006.64.txt
  reloc_addrs_path:
    - configs/reloc_addrs.gblues.txt

  undefined_funcs_auto_path: linker/undefined_funcs_auto.gblues.txt
  undefined_syms_auto_path: linker/undefined_syms_auto.gblues.txt

  extensions_path: tools/splat_ext

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: true
segments:
  - name: gblues
    type: code
    start: 0x0
    vram: 0x801c5000
    bss_size: 0x20000 # yolo
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata]
      - [0x5c0, c, main/main]
      - [0xEC8, rodata]
      - [0x2f10, c, main/misc]

      - [0xC590, data]
#      - { vram: 0x801d2800, type: bss }
  - [0xc800]
